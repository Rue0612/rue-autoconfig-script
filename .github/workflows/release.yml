name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rue-autoconfig-script
          target: x86_64-unknown-linux-musl
          token: ${{ secrets.GITHUB_TOKEN }}
